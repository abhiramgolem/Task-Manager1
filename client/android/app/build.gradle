apply plugin: 'com.android.application'

// Release signing credentials are kept out of source control in
// android/keystore.properties (git-ignored). Absent that file (e.g. on CI or a
// fresh clone) release builds fall back to debug signing so they still assemble.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "io.smarttask.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.smarttask.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode must keep climbing and is never reused: 2 is permanently
        // consumed (v2 went to Production on Play on 9 Jul 2026), 3 shipped as
        // "2.1", 4 as "3.0" (the VoTask rebrand) and 5 as "3.1". 6 shipped as
        // "3.2". 7-13 were consumed by Android-only releases ("3.3"-"3.6") built
        // from a separate local checkout that never merged its version bump back
        // into this branch — this jumps straight to 14 so the number stays ahead
        // of everything already uploaded. versionName is just the label users
        // see, so it doesn't have to track versionCode. 14 shipped as "3.7",
        // 15 as "3.8", 16 as "3.9", 17 as "4.0" and 18 as "4.1". 19 was taken on
        // Play by an upload from elsewhere, so 25 shipped as "4.2" and 26 as
        // "4.3", "4.4" on 27, "4.5" on 28, 29 was spent on an upload of 4.6;
        // "4.6.1" on 30, "4.7" on 31, "4.7.1" on 32, "4.8" on 33, "4.9" on 34, "5.0" on 35, "5.1" on 36; 37 was built as "5.2" but its Play upload
        // was stopped part-way, so it may be taken: this ships as "5.2" on 38.
        // applicationId stays io.smarttask.app: changing it would register a
        // brand-new app on Play, orphaning the existing listing, reviews and
        // installs.
        versionCode 38
        versionName "5.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                // storeFile is resolved relative to client/android/ (rootProject),
                // so a bare filename in keystore.properties points there, not app/.
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // CallMessagingService extends the push plugin's FCM service, and the plugin
    // keeps firebase-messaging as an `implementation` dependency, so the app has
    // to name it to compile against RemoteMessage. Same version as the plugin.
    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.has('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'}"
    // NotificationCompat.CallStyle (androidx.core 1.9+); appcompat only pulls core in transitively.
    implementation "androidx.core:core:$androidxCoreVersion"
    // Google Play's In-App Updates: the "new version available" prompt
    // (AppUpdatePlugin).
    implementation "com.google.android.play:app-update:2.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
